apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. Default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString()` and `String.localeCompare()`
 * that will give correct results when using with locales other than en-US.
 * Note that this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.pgxappreports"
    defaultConfig {
        applicationId "com.pgxappreports"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 38
        versionName "1.38"
        
        // 16KB page alignment support for Android 15+
        ndk {
            // Play Store release ABIs (32-bit + 64-bit ARM).
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        
        // Ensure native libraries are extracted and loaded properly
        missingDimensionStrategy 'react-native-camera', 'general'
    }
    splits {
        abi {
            reset()
            enable false  // Deshabilitado para incluir todas las ABIs en un solo APK
            universalApk true  // Crear un APK universal con todas las ABIs
        }
    }
    packagingOptions {
        // Ensure native libraries are properly aligned for 16KB page size
        jniLibs {
            useLegacyPackaging = false
        }
        // Pick first occurrence for conflicting files
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        
        // Usar pickFirst para libreactnative.so en lugar de exclude
        // Esto toma la versión correcta de React Native principal
        pickFirst 'lib/arm64-v8a/libreactnative.so'
        pickFirst 'lib/armeabi-v7a/libreactnative.so'
        pickFirst 'lib/x86/libreactnative.so'
        pickFirst 'lib/x86_64/libreactnative.so'
        
        // Asegurar que las bibliotecas de featureflags se incluyan
        pickFirst 'lib/arm64-v8a/libreact_featureflagsjni.so'
        pickFirst 'lib/armeabi-v7a/libreact_featureflagsjni.so'
        pickFirst 'lib/x86/libreact_featureflagsjni.so'
        pickFirst 'lib/x86_64/libreact_featureflagsjni.so'
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if(project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
//            storeFile file('my-upload-key.keystore')
//            storePassword 'Dayan123*'
//            keyAlias 'cert_alias'
//            keyPassword 'Dayan123*'
        }

        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            
            // 16KB page alignment for release builds
            packagingOptions {
                jniLibs {
                    useLegacyPackaging = false
                }
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.0.0")

    // Dependencias manuales de módulos nativos (autolinking deshabilitado)
    // react-native-fs
    implementation project(':react-native-fs')
    
    // react-native-vision-camera
    implementation project(':react-native-vision-camera')
    
    // react-native-hole-view
    implementation project(':react-native-hole-view')
    
    // react-native-reanimated
    implementation project(':react-native-reanimated')
    
    // react-native-safe-area-context
    implementation project(':react-native-safe-area-context')
    
    // react-native-vector-icons
    implementation project(':react-native-vector-icons')
    
    // react-native-push-notification
    implementation project(':react-native-push-notification')
    
    // react-native-permissions
    implementation project(':react-native-permissions')
    
    // react-native-file-viewer
    implementation project(':react-native-file-viewer')
    
    // react-native-qrcode-local-image
    implementation project(':react-native-qrcode-local-image')

    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }

    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")
    implementation jscFlavor
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
